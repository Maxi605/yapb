name: Build YaPB (Linux only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x86
    runs-on: ubuntu-24.04

    steps:
      - name: Check out upstream YaPB
        uses: actions/checkout@v4
        with:
          repository: yapb/yapb
          ref: master
          submodules: recursive
          path: yapb

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Build YaPB for Linux
        working-directory: yapb
        shell: bash
        run: ./build.sh --arch=linux-x86

      - name: Verify Linux module
        working-directory: yapb
        shell: bash
        run: |
          set -euo pipefail
          test -f build/ci-linux-x86/yapb.so
          file build/ci-linux-x86/yapb.so
          readelf -h build/ci-linux-x86/yapb.so

      - name: Upload Linux module
        uses: actions/upload-artifact@v4
        with:
          name: yapb-linux-x86
          path: yapb/build/ci-linux-x86/yapb.so
          if-no-files-found: error
          retention-days: 14
